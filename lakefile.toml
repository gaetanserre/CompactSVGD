name = "CompactSVGD"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CompactSVGD"]
testDriver = "CompactSVGDTests"
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true # enables all the style linters of mathlib
maxSynthPendingDepth = 3              # same as mathlib

# Tau Ceti's `main` branch: the most recent Tau Ceti, as `mathlib` would follow
# `master`. After `lake update`, `lean-toolchain` must equal
# `.lake/packages/TauCeti/lean-toolchain`.
# Mathlib comes from Tau Ceti, at the revision Tau Ceti pins: do not require it
# here.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "main"

[[lean_lib]]
name = "CompactSVGD"

[[lean_lib]]
name = "CompactSVGDTests"
globs = ["CompactSVGDTests.*"]

# The `lake comparator` challenge (see `comparator.json`), generated by `scripts/make_challenge.py`.
[[lean_lib]]
name = "CompactSVGDChallenge"
globs = ["CompactSVGDChallenge.+"]