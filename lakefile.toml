name = "CompactSVGD"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["CompactSVGD"]
testDriver = "CompactSVGDTests"
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true # enables all the style linters of mathlib
maxSynthPendingDepth = 3              # same as mathlib

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "CompactSVGD"

[[lean_lib]]
name = "CompactSVGDTests"
globs = ["CompactSVGDTests.*"]

# The `lake comparator` challenge (see `comparator.json`), generated by `scripts/make_challenge.py`.
[[lean_lib]]
name = "CompactSVGDChallenge"
globs = ["CompactSVGDChallenge.+"]