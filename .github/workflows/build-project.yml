name: Build Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:        # Allow manual triggering of the workflow from the GitHub Actions interface

# Cancel previous runs if a new commit is pushed to the same PR or branch
concurrency:
  group: ${{ github.ref }}  # Group runs by the ref (branch or PR)
  cancel-in-progress: true  # Cancel any ongoing runs in the same group

permissions:
  contents: read

jobs:
  build_project:
    runs-on: ubuntu-latest
    name: Build Project
    steps:
      - name: Cleanup to free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build, test and lint project
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # 2026-01-15
        with:
          build: true
          test: true
          lint: true
          mk_all-check: false

      - name: Check that the comparator challenge is up to date
        run: |
          python3 scripts/make_challenge.py
          git diff --exit-code CompactSVGDChallenge comparator.json

      # The sandbox of `lake comparator`. Ubuntu 24.04 forbids the unprivileged user namespaces that
      # bubblewrap needs, unless this sysctl is unset.
      - name: Install bubblewrap
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The website, written to `_site/` with its figures (see `showcase/showcase.md`). On a push,
      # `lake comparator` runs first, in its sandbox, and the website shows its verdict. The
      # manifest of `showcase/` is resolved here, so that it takes the dependencies of the project.
      - name: Build the website
        working-directory: showcase
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update CompactSVGD
          lake exe showcase ${{ github.event_name == 'push' && '--comparator' || '' }} --out ../_site

      # The API documentation, written to `_site/docs`, on a push only. The deployment is done below,
      # with the website.
      - name: Build the API documentation
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # 2026-10-05
        with:
          homepage: _site
          references: docs/references.bib
          build-page: false
          deploy: false

      - name: Upload the website and the API documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build_project
    runs-on: ubuntu-latest
    permissions:
      pages: write     # Deploy to GitHub Pages
      id-token: write  # Verify that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
